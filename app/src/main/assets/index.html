<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IPTV MAX 4K</title><style>
*{box-sizing:border-box}body{margin:0;background:#061022;color:#f4f7ff;font-family:Arial,sans-serif}header{padding:24px 16px;background:linear-gradient(120deg,#143e88,#07112b)}h1{margin:0;color:#ffd04d}small{color:#aebdd5}.nav{display:flex;gap:8px;overflow:auto;padding:14px}button,select,input{background:#1b2b4a;border:1px solid #39527b;border-radius:12px;color:white;padding:12px;font-size:15px}button.active{background:#d49c17;color:#071022}input{width:100%;margin:8px 0}main{padding:12px}#list{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.item{background:#152441;border:1px solid #30496d;border-radius:14px;padding:12px;min-height:112px}.item img{width:65px;height:45px;object-fit:contain}.item strong{display:block;margin:7px 0}.item button{padding:7px}#player{width:100%;max-height:280px;background:black}#notice{color:#e2c578;margin:12px 0}#adult{display:none}
</style></head><body><header><h1>📺 IPTV MAX 4K</h1><small>Chaînes gratuites publiques · Catalogue sans liste à saisir</small></header>
<div class="nav"><button class="active" onclick="tab('tv',this)">TV en direct</button><button onclick="tab('films',this)">Films</button><button onclick="tab('series',this)">Séries</button><button onclick="tab('fav',this)">⭐ Favoris</button><button onclick="unlock()">🔒 Adultes</button></div>
<main><input id="search" placeholder="🔎 Rechercher une chaîne" oninput="render()"><select id="country" onchange="render()"><option value="">Tous les pays</option><option value="TN">🇹🇳 Tunisie</option><option value="FR">🇫🇷 France</option><option value="IT">🇮🇹 Italie</option><option value="CH">🇨🇭 Suisse</option><option value="DZ">🇩🇿 Algérie</option><option value="MA">🇲🇦 Maroc</option></select><button onclick="load()">↻ Actualiser</button><p id="notice">Chargement du catalogue…</p><video id="player" controls playsinline style="display:none"></video><div id="list"></div></main>
<script>
let channels=[],mode='tv',adult=false;const $=id=>document.getElementById(id);const safe=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function tab(m,b){mode=m;document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()}
function unlock(){let p=prompt('Code PIN Adultes');if(p==='0000'){adult=true;mode='adult';render()}else if(p!==null)alert('Code incorrect')}
function favorites(){try{return JSON.parse(localStorage.favorites||'[]')}catch(e){return []}}
function star(id){let f=favorites();f=f.includes(id)?f.filter(x=>x!==id):[...f,id];localStorage.favorites=JSON.stringify(f);render()}
function play(i){let c=channels[i];if(!c)return;let v=$('player');v.style.display='block';v.src=c.url;v.play().catch(()=>{$('notice').textContent='Ce flux ne peut pas être lu sur cet appareil.'});scrollTo(0,0)}
const catalog=[
{type:'films',title:'Films gratuits sur ARTE',genre:'Cinéma, classiques, documentaires',year:'Catalogue évolutif',url:'https://www.arte.tv/fr/videos/cinema/'},
{type:'films',title:'Films gratuits sur TV5MONDEplus',genre:'Cinéma francophone',year:'Toutes époques',url:'https://www.tv5mondeplus.com/'},
{type:'films',title:'Films sur france.tv',genre:'Films français et européens',year:'Catalogue évolutif',url:'https://www.france.tv/films/'},
{type:'films',title:'Films gratuits sur Plex',genre:'Action, comédie, classiques',year:'Toutes époques',url:'https://watch.plex.tv/'},
{type:'series',title:'Séries françaises sur france.tv',genre:'Policier, drame, comédie',year:'Saisons récentes et anciennes',url:'https://www.france.tv/series-et-fictions/'},
{type:'series',title:'Séries sur ARTE',genre:'Thriller, drame, séries européennes',year:'Catalogue évolutif',url:'https://www.arte.tv/fr/videos/series-et-fictions/'},
{type:'series',title:'Séries francophones TV5MONDEplus',genre:'Fictions et séries françaises',year:'Catalogue évolutif',url:'https://www.tv5mondeplus.com/'},
{type:'series',title:'Séries gratuites sur Plex',genre:'Comédie, drame, action',year:'Toutes époques',url:'https://watch.plex.tv/'}
];
function renderCatalog(){let q=$('search').value.toLowerCase();let a=catalog.filter(c=>c.type===mode&&(c.title+' '+c.genre+' '+c.year).toLowerCase().includes(q));$('notice').textContent=a.length+' catalogues gratuits à explorer. Lecture chez le diffuseur, selon disponibilité dans ton pays.';$('list').innerHTML=a.map(c=>'<div class="item"><div style="font-size:34px">🎬</div><strong>'+safe(c.title)+'</strong><small>'+safe(c.genre)+' · '+safe(c.year)+'</small><p><button onclick="window.open('+JSON.stringify(c.url).replace(/"/g,'&quot;')+',\'_blank\')">▶ Voir le catalogue</button></p></div>').join('')}
function render(){let q=$('search').value.toLowerCase(),co=$('country').value,f=favorites();let a=channels.map((c,i)=>({...c,i})).filter(c=>(adult&&mode==='adult'?c.adult:!c.adult)&&(mode==='fav'?f.includes(c.url):true)&&(!co||c.country===co)&&c.title.toLowerCase().includes(q));if(mode==='films'||mode==='series'){renderCatalog();return} $('notice').textContent=a.length+' chaînes trouvées. Certains flux peuvent être indisponibles ou géobloqués.';$('list').innerHTML=a.slice(0,400).map(c=>'<div class="item">'+(c.logo?'<img loading="lazy" src="'+safe(c.logo)+'">':'📺')+'<strong>'+safe(c.title)+'</strong><small>'+safe(c.country)+'</small><p><button onclick="play('+c.i+')">▶ Lire</button> <button onclick="star('+JSON.stringify(c.url).replace(/"/g,'&quot;')+')">'+(f.includes(c.url)?'★':'☆')+'</button></p></div>').join('')}
async function load(){ $('notice').textContent='Chargement des chaînes…';try{let r=await fetch('https://iptv-org.github.io/api/streams.json');if(!r.ok)throw Error('HTTP '+r.status);let streams=await r.json();let cr=await fetch('https://iptv-org.github.io/api/channels.json');let metadata=cr.ok?await cr.json():[];let map=new Map(metadata.map(x=>[x.id,x]));channels=streams.filter(x=>x.url&&x.channel).map(x=>{let c=map.get(x.channel)||{};return {title:c.name||x.title||x.channel,url:x.url,logo:c.logo||'',country:c.country||'',adult:c.is_nsfw===true}});render()}catch(e){$('notice').textContent='Catalogue inaccessible : '+e.message+'. Vérifie Internet puis appuie sur Actualiser.'}}
load();
</script></body></html>
