name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build using installed Android SDK and Gradle
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee build-log.txt) 2>&1
          trap 'echo "FAILED at line $LINENO: $BASH_COMMAND"' ERR
          echo "Android SDK: ${ANDROID_HOME:-unset}"
          java -version
          echo "Installed SDK directories:"
          ls -la "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platforms" || true
          echo "Installing Gradle 8.10.2"
          curl --fail --location --retry 3 --silent --show-error -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "Building APK"
          /tmp/gradle-8.10.2/bin/gradle :app:assembleDebug --stacktrace --no-daemon
          echo "APK built"
          ls -lh app/build/outputs/apk/debug/
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: IPTV-MAX-4K-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: IPTV-MAX-4K-diagnostics
          path: build-log.txt
          if-no-files-found: warn
